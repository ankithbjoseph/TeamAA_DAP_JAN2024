name: Build and Push Dashboard Image

on:
  push:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-build-and-push.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dashboard with Docker Compose
        run: |
          docker compose -f docker-compose.yaml build --pull --no-cache dashboard

      - name: Push dashboard image to GHCR
        run: |
          docker compose -f docker-compose.yaml push dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
